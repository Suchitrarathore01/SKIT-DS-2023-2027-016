name: Generate Weekly Form-3 Report

on:
  schedule:
    - cron: "29 18 * * 4"
  workflow_dispatch:

# Prevent multiple runs from pushing to main at the same time
concurrency:
  group: weekly-form3-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      # Checkout the complete repository history
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install reportlab

      # Generate weekly report
      - name: Generate weekly report
        run: |
          python generate_report.py weekly

      # Commit and push generated report
      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add weekly_reports/

          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi

          git commit -m "Auto-generate weekly Form-3 report"

          # Get the latest changes from GitHub
          git fetch origin main

          # Rebase our new commit on top of the latest main
          git rebase origin/main

          # Push the updated branch
          git push origin HEAD:main
